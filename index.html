<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Mundo del PVC - Sistema de Gestión</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent: #2563eb;
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
      --accent-red: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2d2d35;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 15px; }
    .container { width: 100%; max-width: 500px; margin: 0 auto; }
    .card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border); margin-bottom: 15px; }
    h1, h2, h3 { text-align: center; color: var(--text-main); margin-bottom: 15px; }
    label { display: block; margin-top: 10px; font-size: 14px; color: var(--text-muted); }
    input, select, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid var(--border); background-color: #18181c; color: #fff; font-size: 16px; }
    button { background-color: var(--accent); color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
    button:active { opacity: 0.9; }
    .btn-green { background-color: var(--accent-green); }
    .btn-gold { background-color: var(--accent-gold); color: #000; }
    .btn-red { background-color: var(--accent-red); }
    .hidden { display: none !important; }
    .nav-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
    .nav-tabs button { flex: 1; padding: 10px 5px; font-size: 12px; margin-top: 0; background: #2a2a32; }
    .nav-tabs button.active { background: var(--accent); }
    .res-box { background: #18181c; padding: 10px; border-radius: 6px; margin-top: 10px; border-left: 4px solid var(--accent); font-size: 14px; line-height: 1.5; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-admin { background: var(--accent-gold); color: #000; }
    .badge-vendedor { background: var(--accent); color: #fff; }
  </style>
</head>
<body>

<div class="container">

  <!-- PANTALLA DE LOGIN -->
  <div id="sec-login" class="card">
    <h2>EL MUNDO DEL PVC</h2>
    <p style="text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 15px;">Sistema de Cotización y Gestión</p>
    <label for="passInput">Ingresa tu clave de acceso:</label>
    <input type="password" id="passInput" placeholder="Clave (ej: 1234)">
    <button onclick="login()">Ingresar al Sistema</button>
    <p id="loginError" style="color: var(--accent-red); text-align: center; font-size: 13px; margin-top: 10px;" class="hidden">Clave incorrecta. Intenta de nuevo.</p>
  </div>

  <!-- SISTEMA PRINCIPAL -->
  <div id="sec-app" class="hidden">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <span id="userRoleBadge" class="badge"></span>
      <button onclick="logout()" style="width: auto; padding: 5px 10px; font-size: 12px; margin-top: 0;" class="btn-red">Cerrar Sesión</button>
    </div>

    <!-- NAVEGACIÓN DE PESTAÑAS -->
    <div class="nav-tabs">
      <button id="tab-btn-cotiz" class="active" onclick="switchTab('cotizador')">Cotizador</button>
      <button id="tab-btn-gastos" onclick="switchTab('gastos')">Gastos</button>
      <button id="tab-btn-socios" class="admin-only" onclick="switchTab('socios')">Socios</button>
    </div>

    <!-- PESTAÑA 1: COTIZADOR -->
    <div id="tab-cotizador" class="card">
      <h3>Cotizador PVC</h3>
      <label>Ancho del Techo (m):</label>
      <input type="number" id="cAncho" step="0.01" placeholder="Ej: 4">
      
      <label>Largo del Techo (m):</label>
      <input type="number" id="cLargo" step="0.01" placeholder="Ej: 5">

      <label>Precio m² PVC ($):</label>
      <input type="number" id="cPrecioM2" step="0.01" value="12">

      <button onclick="calcularCotizacion()">Calcular Materiales y Precio</button>

      <div id="resCotizacion" class="res-box hidden"></div>
    </div>

    <!-- PESTAÑA 2: GASTOS -->
    <div id="tab-gastos" class="card hidden">
      <h3>Registro de Gastos</h3>
      <label>Descripción:</label>
      <input type="text" id="gDesc" placeholder="Ej: Almuerzo, Transporte">

      <label>Monto ($):</label>
      <input type="number" id="gMonto" step="0.01" placeholder="Ej: 15.50">

      <label>Tipo de Gasto:</label>
      <select id="gTipo">
        <option value="Diario">Gasto Diario</option>
        <option value="Fijo">Gasto Fijo</option>
      </select>

      <button onclick="registrarGasto()" class="btn-gold">Registrar Gasto</button>

      <div id="resGastos" class="res-box" style="margin-top: 15px;">
        <strong>Gastos Registrados:</strong>
        <div id="listaGastos" style="margin-top: 5px; font-size: 13px;">No hay gastos registrados.</div>
        <hr style="margin: 8px 0; border-color: var(--border);">
        <div><strong>Total Gastos: $<span id="totalGastos">0.00</span></strong></div>
      </div>
    </div>

    <!-- PESTAÑA 3: SOCIOS (SOLO ADMIN) -->
    <div id="tab-socios" class="card hidden admin-only">
      <h3>Reparto de Ganancia Neta</h3>
      <label>Ventas Totales ($):</label>
      <input type="number" id="sVentas" step="0.01" placeholder="Ej: 1000">

      <label>Costo de Materiales/Inversión ($):</label>
      <input type="number" id="sCostos" step="0.01" placeholder="Ej: 400">

      <button onclick="calcularSocios()" class="btn-green">Calcular Reparto Neta</button>

      <div id="resSocios" class="res-box hidden"></div>
    </div>

  </div>

</div>

<script>
  let currentRole = null;
  let gastos = [];

  function login() {
    const pass = document.getElementById('passInput').value.trim();
    const err = document.getElementById('loginError');

    if (pass === '1234') {
      currentRole = 'ADMIN';
    } else if (pass === '5678') {
      currentRole = 'VENDEDOR';
    } else {
      err.classList.remove('hidden');
      return;
    }

    err.classList.add('hidden');
    document.getElementById('sec-login').classList.add('hidden');
    document.getElementById('sec-app').classList.remove('hidden');

    const badge = document.getElementById('userRoleBadge');
    if (currentRole === 'ADMIN') {
      badge.textContent = 'Modo: Administrador';
      badge.className = 'badge badge-admin';
      document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
    } else {
      badge.textContent = 'Modo: Vendedor';
      badge.className = 'badge badge-vendedor';
      document.querySelectorAll('.admin-only').forEach(el => el.classList.add('hidden'));
    }
  }

  function logout() {
    currentRole = null;
    document.getElementById('passInput').value = '';
    document.getElementById('sec-app').classList.add('hidden');
    document.getElementById('sec-login').classList.remove('hidden');
  }

  function switchTab(tab) {
    document.getElementById('tab-cotizador').classList.add('hidden');
    document.getElementById('tab-gastos').classList.add('hidden');
    document.getElementById('tab-socios').classList.add('hidden');

    document.getElementById('tab-btn-cotiz').classList.remove('active');
    document.getElementById('tab-btn-gastos').classList.remove('active');
    document.getElementById('tab-btn-socios').classList.remove('active');

    if (tab === 'cotizador') {
      document.getElementById('tab-cotizador').classList.remove('hidden');
      document.getElementById('tab-btn-cotiz').classList.add('active');
    } else if (tab === 'gastos') {
      document.getElementById('tab-gastos').classList.remove('hidden');
      document.getElementById('tab-btn-gastos').classList.add('active');
    } else if (tab === 'socios') {
      document.getElementById('tab-socios').classList.remove('hidden');
      document.getElementById('tab-btn-socios').classList.add('active');
    }
  }

  function calcularCotizacion() {
    const ancho = parseFloat(document.getElementById('cAncho').value) || 0;
    const largo = parseFloat(document.getElementById('cLargo').value) || 0;
    const precioM2 = parseFloat(document.getElementById('cPrecioM2').value) || 0;

    if (ancho <= 0 || largo <= 0) {
      alert('Ingresa dimensiones válidas.');
      return;
    }

    const area = ancho * largo;
    const totalPrecio = area * precioM2;

    // Estimación aproximada de estructura PVC por m2
    const laminasPVC = Math.ceil(area / 1.18); // Láminas aprox de 5.95m x 0.20m
    const cornisas = Math.ceil((ancho + largo) * 2 / 5.95);
    const omegas = Math.ceil(area * 0.8);
    const viguetas = Math.ceil(area * 0.3);

    const res = document.getElementById('resCotizacion');
    res.innerHTML = `
      <strong>Resultado de Cotización:</strong><br>
      • Área Total: <strong>${area.toFixed(2)} m²</strong><br>
      • Precio Total Materiales: <strong>$${totalPrecio.toFixed(2)}</strong><br><br>
      <strong>Estructura Estimada:</strong><br>
      • Láminas de PVC (5.95m): ~${laminasPVC} uds<br>
      • Cornisas (5.95m): ~${cornisas} uds<br>
      • Omegas: ~${omegas} uds<br>
      • Viguetas: ~${viguetas} uds
    `;
    res.classList.remove('hidden');
  }

  function registrarGasto() {
    const desc = document.getElementById('gDesc').value.trim();
    const monto = parseFloat(document.getElementById('gMonto').value) || 0;
    const tipo = document.getElementById('gTipo').value;

    if (!desc || monto <= 0) {
      alert('Ingresa una descripción y un monto válido.');
      return;
    }

    gastos.push({ desc, monto, tipo });
    document.getElementById('gDesc').value = '';
    document.getElementById('gMonto').value = '';

    actualizarListaGastos();
  }

  function actualizarListaGastos() {
    const container = document.getElementById('listaGastos');
    let total = 0;

    if (gastos.length === 0) {
      container.innerHTML = 'No hay gastos registrados.';
    } else {
      let html = '';
      gastos.forEach((g) => {
        total += g.monto;
        html += `• ${g.desc} (${g.tipo}): <strong>$${g.monto.toFixed(2)}</strong><br>`;
      });
      container.innerHTML = html;
    }

    document.getElementById('totalGastos').textContent = total.toFixed(2);
  }

  function calcularSocios() {
    const ventas = parseFloat(document.getElementById('sVentas').value) || 0;
    const costos = parseFloat(document.getElementById('sCostos').value) || 0;
    
    let totalG = 0;
    gastos.forEach(g => totalG += g.monto);

    const gananciaNeta = ventas - costos - totalG;
    const porSocio = gananciaNeta / 2;

    const res = document.getElementById('resSocios');
    res.innerHTML = `
      <strong>Resumen Financiero:</strong><br>
      • Ventas Totales: $${ventas.toFixed(2)}<br>
      • Costo de Materiales: -$${costos.toFixed(2)}<br>
      • Gastos Registrados: -$${totalG.toFixed(2)}<br>
      <hr style="margin: 5px 0; border-color: var(--border);">
      • <strong>Ganancia Neta Total: $${gananciaNeta.toFixed(2)}</strong><br>
      • <strong>Reparto por Socio (50%): $${porSocio.toFixed(2)} cada uno</strong>
    `;
    res.classList.remove('hidden');
  }
</script>

</body>
</html>
